<!DOCTYPE html>
<html lang="fr">

        h1{
            text-align: center;
            background-color: aqua;
            margin: 75px auto;
        }
    </style>
</head>
<body>
    <h1>Ajouter un auteur</h1>
    <form action="requête_sql.php" method="POST">
        <fieldset>
            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" placeholder="Entez le nom"><br><br>

            <input type="text" id="prenom" name="prenom" placeholder="Entez le prenom"><br><br>

            <input type="date" id="datedenaissance" name="datedenaissance"><br><br>

            <input type="radio" name="nationalité" value="US">US
